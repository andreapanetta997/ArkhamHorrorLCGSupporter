<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guida al Round — Arkham Horror LCG</title>
<meta name="version" content="0.0.10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c110f;--card:#151d19;--card2:#1c2621;--line:#2a3731;--txt:#e9e5d8;--mut:#98a59e;
  --gold:#caa75a;--gold2:#e3c57e;--doom:#c4473d;--hp:#c95e50;--san:#5d91d4;--clue:#4db59b;--res:#d8a940;--ok:#5fae6a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:Cinzel,serif;letter-spacing:.02em;margin:0}
h2{font-size:1.15rem;color:var(--gold2)}
h3{font-size:.98rem;color:var(--gold2);margin-bottom:6px}
a{color:var(--gold2)}
header{position:sticky;top:0;z-index:20;background:rgba(12,17,15,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
.hrow{display:flex;align-items:center;gap:8px;max-width:760px;margin:0 auto}
.hrow h1{font-size:1rem;flex:1;color:var(--gold);display:flex;align-items:center;gap:6px;min-width:0}
.ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hrow h1 .ver,.hrow h1 .conn{flex:none}
.ver{font-family:Inter,system-ui,sans-serif;font-size:.68rem;font-weight:600;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:1px 7px;margin-left:0;vertical-align:middle;letter-spacing:0}
main{max-width:760px;margin:0 auto;padding:12px 12px calc(96px + env(safe-area-inset-bottom))}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#0f1613;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border:0;border-radius:0;color:var(--mut);padding:10px 4px 12px;font-size:.78rem;min-height:56px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--gold2)}
nav svg{width:22px;height:22px}
button{font:inherit;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px 13px;min-height:42px;cursor:pointer}
button:active{transform:scale(.97)}
button.primary{background:var(--gold);color:#1b1407;border-color:var(--gold);font-weight:700}
button.danger{border-color:#6b2c27;color:#f0b3ab}
button.ghost{background:none}
button.sm{min-height:34px;padding:5px 10px;font-size:.85rem}
button:disabled{opacity:.4}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.muted{color:var(--mut)}
.small{font-size:.85rem}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1}
.badge{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 7px;border-radius:999px;background:#3a3220;color:var(--gold2);vertical-align:middle}
.badge.out{background:#3a2422;color:#f0b3ab}
.note{border-left:3px solid var(--gold);background:#1a201b;padding:8px 10px;border-radius:6px;margin:8px 0;font-size:.9rem}
.warn{border-left-color:var(--doom);background:#251615}
.okbox{border-left-color:var(--ok)}
ul.clean{list-style:none;padding:0;margin:0}
ul.bul{margin:6px 0;padding-left:20px}
ul.bul li{margin:3px 0}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.box{flex:none;width:24px;height:24px;border:2px solid var(--line);border-radius:7px;display:grid;place-items:center;margin-top:1px}
.check.done .box{background:var(--ok);border-color:var(--ok)}
.check.done .lbl{color:var(--mut);text-decoration:line-through}
.box svg{width:15px;height:15px;color:#0c110f;opacity:0}
.check.done .box svg{opacity:1}
/* status */
.status{display:grid;gap:8px;margin-bottom:12px}
.phases{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.ph{font-size:.72rem;text-align:center;padding:6px 2px;border-radius:8px;background:var(--card);color:var(--mut);border:1px solid var(--line)}
.ph.on{background:#2c2614;color:var(--gold2);border-color:var(--gold)}
.ph.skip{opacity:.4;text-decoration:line-through}
.meter{display:flex;align-items:center;gap:10px}
.meter .lab{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.bar{height:8px;background:#26302b;border-radius:99px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--doom)}
.big{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.ctr{display:flex;align-items:center;gap:6px}
.ctr button{width:38px;min-height:38px;padding:0;font-size:1.2rem;line-height:1}
.ctr .v{min-width:44px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
/* step */
.steph{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.stepn{font-size:.75rem;color:var(--mut)}
.navbtns{display:flex;gap:8px;margin-top:12px}
.navbtns .primary{flex:1}
/* investigators */
.inv{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;background:var(--card2)}
.inv.done{opacity:.55}
.inv.isout{opacity:.4}
.pips{display:flex;gap:8px;margin:8px 0}
.pip{width:42px;height:42px;border-radius:50%;border:2px solid var(--gold);background:none;padding:0;min-height:0}
.pip.used{background:var(--gold);}
.pip.tome{border-style:dashed}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px}
.stat .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);display:flex;justify-content:space-between}
.k.hp{color:var(--hp)}.k.san{color:var(--san)}.k.clue{color:var(--clue)}.k.res{color:var(--res)}
.skills{display:flex;gap:10px;font-size:.82rem;color:var(--mut)}
.skills b{color:var(--txt)}
/* forms */
label.f{display:block;font-size:.8rem;color:var(--mut);margin:10px 0 4px}
select,input[type=text],input[type=number]{font:inherit;width:100%;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:42px}
.opts{display:grid;gap:8px}
.opt{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card2);cursor:pointer}
.opt.on{border-color:var(--gold);background:#272214}
.opt b{display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.invrow{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}
/* tokens */
.tok{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 6px;border-radius:50%;background:#2a2e2b;border:2px solid #4a514c;font-weight:700;font-size:.85rem;margin:3px}
.tok.s{border-color:var(--gold);color:var(--gold2);border-radius:10px;font-size:.72rem}
.draw{font-size:2.4rem;font-weight:700;text-align:center;padding:14px;font-family:Cinzel,serif;color:var(--gold2)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
td,th{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--gold2);font-weight:600}
details{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:var(--card)}
details summary{cursor:pointer;font-family:Cinzel,serif;color:var(--gold2);font-weight:600}
details[open] summary{margin-bottom:8px}
.log li{font-size:.82rem;color:var(--mut);padding:3px 0;border-bottom:1px dashed var(--line)}
.tk{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3d433f,#151916 75%);border:2px solid #59615b;color:var(--c,#e9e5d8);font-weight:800;font-size:.95rem;margin:3px;box-shadow:inset 0 -3px 5px rgba(0,0,0,.55),0 1px 2px rgba(0,0,0,.4);font-variant-numeric:tabular-nums;vertical-align:middle}
.tk svg{width:74%;height:74%;display:block}
.tk.sm{width:30px;height:30px;margin:0;font-size:.8rem}
.tk.lg{width:124px;height:124px;border-width:4px;font-size:2.8rem;box-shadow:inset 0 -6px 12px rgba(0,0,0,.6),0 6px 22px rgba(0,0,0,.6),0 0 0 6px rgba(202,167,90,.12)}
.tk-fail{border-color:#7a2f29}.tk-sign{border-color:#8a7440}
.tkrow{display:flex;flex-wrap:wrap}
td.tkcell{white-space:nowrap}td.tkcell span{margin-left:8px;font-weight:600;vertical-align:middle}
.stage{height:170px;display:grid;place-items:center;perspective:600px}
.bagsvg{width:118px;height:auto;transform-origin:50% 25%;filter:drop-shadow(0 8px 10px rgba(0,0,0,.5))}
.shaking .bagsvg{animation:shake .85s ease-in-out}
@keyframes shake{0%,100%{transform:rotate(0)}12%{transform:rotate(-14deg) translateX(-4px)}26%{transform:rotate(12deg) translateX(4px)}40%{transform:rotate(-10deg)}54%{transform:rotate(8deg)}68%{transform:rotate(-5deg) translateY(-3px)}84%{transform:rotate(3deg) scale(1.04,.96)}}
.pop{animation:pop .75s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{0%{transform:translateY(70px) scale(.15) rotateY(720deg);opacity:0}55%{opacity:1}100%{transform:none}}
.failfx .tk{animation:redflash 1.2s .5s}.signfx .tk{animation:goldflash 1.2s .5s}
@keyframes redflash{0%,100%{}40%{box-shadow:0 0 0 10px rgba(236,94,80,.35),0 0 40px rgba(236,94,80,.7)}}
@keyframes goldflash{0%,100%{}40%{box-shadow:0 0 0 10px rgba(242,210,122,.3),0 0 40px rgba(242,210,122,.7)}}
.fadein{animation:fadein .5s .35s both}@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.drawname{font-family:Cinzel,serif;color:var(--gold2);font-size:1.25rem;font-weight:700;margin-top:4px}
@media (prefers-reduced-motion:reduce){.pop,.shaking .bagsvg,.fadein,.failfx .tk,.signfx .tk{animation:none}}

.conn{width:9px;height:9px;border-radius:50%;margin-left:6px;vertical-align:middle;background:#777}
.conn.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}.conn.connecting{background:var(--res)}.conn.err{background:var(--doom)}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translate(-50%,-20px);opacity:0;pointer-events:none;z-index:60;background:#2c2614;border:1px solid var(--gold);color:var(--gold2);padding:10px 16px;border-radius:12px;font-weight:600;max-width:92vw;text-align:center;transition:.25s}
#toast.on{opacity:1;transform:translate(-50%,0)}#toast.bad{background:#2a1513;border-color:var(--doom);color:#f0b3ab}
.code{font-family:ui-monospace,monospace;font-size:1.3rem;font-weight:800;letter-spacing:.12em;color:var(--gold2)}
.qr{background:#e9e5d8;padding:6px;border-radius:8px;flex:none}.qr img,.qr canvas{display:block}
.ctext{font-size:.88rem;margin-top:4px;line-height:1.45}
.ico{display:inline-block;font-size:.7rem;font-weight:700;padding:1px 6px;border-radius:6px;margin-right:4px;background:#2a302c;border:1px solid var(--line)}
.ico-w{color:#d9b46a}.ico-i{color:#8fb2e6}.ico-c{color:#e08a7c}.ico-a{color:#86d39a}.ico-x{color:#e9e5d8}
.inv.exh{opacity:.65;transform:rotate(-1.2deg)}.inv.selc{border-color:var(--gold);background:#272214}
.slots{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.slotc{font-size:.72rem;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mut)}.slotc.over{border-color:var(--doom);color:#f0b3ab}
details.cdet{border:0;padding:0;margin:6px 0 0;background:none}details.cdet summary{font-family:Inter,system-ui,sans-serif;font-size:.8rem;color:var(--mut)}
.opt .small{display:block}

.clink{cursor:pointer;display:inline-flex;align-items:center;gap:7px;text-decoration:underline;text-decoration-color:rgba(202,167,90,.35);text-underline-offset:3px}
.cthumb{flex:none;display:inline-grid;place-items:center;width:20px;height:28px;border-radius:4px;font-size:.7rem;font-weight:800;color:#fff;background:var(--fc,#777);border:1px solid rgba(255,255,255,.25);box-shadow:0 1px 2px rgba(0,0,0,.5);text-decoration:none}
.f-G{--fc:#2f6db5}.f-S{--fc:#c98f22}.f-C{--fc:#33884a}.f-M{--fc:#7a4bb6}.f-V{--fc:#b23a3a}.f-N{--fc:#7d7f7c}.wk{--fc:#222}
.cthumb.wk{border-color:#b23a3a}
#cv{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:16px}
#cv.on{display:flex}
.cvbox{width:min(340px,100%);max-height:92vh;overflow:auto;animation:cvin .25s ease-out}
@keyframes cvin{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.cf{border-radius:16px;background:linear-gradient(#efe6cf,#e2d5b4);color:#231c12;border:6px solid var(--fc);box-shadow:0 10px 40px rgba(0,0,0,.6);overflow:hidden;font-size:.9rem}
.cf.wk{border-color:#1d1d1d}
.cf-top{display:flex;align-items:center;gap:8px;background:var(--fc);color:#fff;padding:8px 10px}
.cf.wk .cf-top{background:#1d1d1d}
.cf-cost{flex:none;width:34px;height:34px;border-radius:50%;background:#efe6cf;color:#231c12;display:grid;place-items:center;font-weight:800;font-size:1.1rem;border:2px solid rgba(0,0,0,.3)}
.cf-cost.empty{background:transparent;border-color:transparent}
.cf-name{flex:1;font-family:Cinzel,serif;font-weight:700;font-size:1.02rem;line-height:1.15;text-align:center}
.cf-sub{font-family:Inter,sans-serif;font-weight:500;font-size:.72rem;opacity:.9}
.cf-lvl{flex:none;font-size:.6rem;letter-spacing:1px;width:34px;text-align:center}
.cf-type{text-align:center;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;padding:5px;border-bottom:1px solid rgba(0,0,0,.15);color:#5a4a2e}
.cf-ics{display:flex;gap:4px;padding:6px 10px 0}
.cf-icon{font-size:.68rem;font-weight:800;padding:2px 6px;border-radius:6px;background:#231c12}
.cf-tr{text-align:center;font-style:italic;font-weight:600;font-size:.8rem;padding:6px 10px 0}
.cf-tx{padding:8px 12px 10px;line-height:1.45}
.cf-tx hr{border:0;border-top:1px dashed rgba(0,0,0,.25);margin:8px 0}
.cf-bot{background:rgba(0,0,0,.08);padding:7px 12px;font-size:.8rem;font-weight:600;border-top:1px solid rgba(0,0,0,.12)}

.cthumb.hasimg{box-shadow:0 0 0 2px var(--gold),0 1px 2px rgba(0,0,0,.5)}
.cvimg{display:block;width:100%;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.cvload{height:300px;display:grid;place-items:center;color:var(--mut);border:1px dashed var(--line);border-radius:14px}
/* modal */
#modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-width:760px;width:100%;max-height:85vh;overflow:auto}
@media(min-width:700px){#modal{align-items:center}.sheet{border-radius:16px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<header><div class="hrow">
  <h1><span class="ttl">Arkham · Guida al Round</span><span id="ver" class="ver"></span></h1>
  <button class="sm ghost" data-a="undo" id="undoBtn" title="Annulla ultima modifica">↶ Annulla</button>
  <button class="sm ghost" data-a="menu">☰</button>
</div></header>
<main id="app"></main>
<nav id="tabs"></nav>
<div id="modal"><div class="sheet" id="sheet"></div></div>

<script>
/* ===================== DATI ===================== */
const APP_VERSION='0.0.10';
const LS='ahlcg-guida-round-v1';
const INV={
  roland:{n:'Roland Banks',c:'Guardiano',hp:9,san:5,sk:[3,3,4,2],ab:'Reazione: dopo che hai sconfitto un nemico, scopri 1 indizio nel tuo luogo (1 volta per round).',es:'+1 per ogni indizio nel tuo luogo.'},
  daisy:{n:'Daisy Walker',c:'Studioso',hp:5,san:9,sk:[3,5,2,2],ab:'1 azione aggiuntiva per turno, solo per capacità [→] di carte Tomo.',es:'+0. Se hai successo, pesca 1 carta per ogni Tomo che controlli.'},
  skids:{n:'"Skids" O\'Toole',c:'Canaglia',hp:8,san:6,sk:[2,3,3,4],ab:'Gratis, durante il tuo turno: spendi 2 risorse per 1 azione aggiuntiva (1 volta per turno).',es:'+2. Se hai successo, ottieni 2 risorse.'},
  agnes:{n:'Agnes Baker',c:'Mistico',hp:6,san:8,sk:[5,2,2,3],ab:'Reazione: dopo che ricevi 1+ orrori, infliggi 1 danno a un nemico nel tuo luogo (1 volta per fase).',es:'+1 per ogni orrore su di te.'},
  wendy:{n:'Wendy Adams',c:'Sopravvissuto',hp:7,san:7,sk:[4,3,1,4],ab:'Reazione: quando riveli un segnalino, scarta 1 carta dalla mano per annullarlo e rivelarne un altro (1 volta per prova).',es:'+0. Con l\'Amuleto di Wendy in gioco, successo automatico.'},
  altro:{n:'Altro investigatore',c:'',hp:7,san:7,sk:null,ab:'',es:'Vedi la carta investigatore.'}
};
const DIFF={
  facile:{n:'Facile',side:'std',bag:['+1','+1','0','0','0','−1','−1','−1','−2','−2']},
  standard:{n:'Standard',side:'std',bag:['+1','0','0','−1','−1','−1','−2','−2','−3','−4']},
  difficile:{n:'Difficile',side:'hard',bag:['0','0','0','−1','−1','−2','−2','−3','−3','−4','−5']},
  esperto:{n:'Esperto',side:'hard',bag:['0','−1','−1','−2','−2','−3','−3','−4','−4','−5','−6','−8']}
};
const TK={skull:'Teschio',cultist:'Cultista',tablet:'Tavoletta',elder:'Antico',sign:'Simbolo degli Antichi',fail:'Fallimento automatico'};
const SCEN={
  adunanza:{n:"I · L'Adunanza",
    agendas:[{n:'Cosa Succede?',d:3},{n:"L'Ascesa dei Ghoul",d:7},{n:'Stanno Uscendo!',d:10,notes:{
      endEnemy:'Obbligo (Trama 3): ogni nemico Ghoul non impegnato si muove di 1 luogo verso il Salotto.',
      endRound:'Obbligo (Trama 3): +1 destino su questa trama per ogni nemico Ghoul nel Corridoio o nel Salotto.'}}],
    acts:[{n:'In Trappola',c:2},{n:'La Barriera',c:3,notes:{
      always:'Obiettivo (Capitolo 2): gli indizi si spendono solo a fine round, dagli investigatori nel Corridoio.',
      endRound:'Obiettivo (Capitolo 2): gli investigatori nel Corridoio possono spendere ora 3 indizi per investigatore per proseguire.'}},
      {n:'Che Cosa Avete Fatto?',obj:'Obiettivo: sconfiggere il Ghoul Sacerdote.'}],
    tokens:{std:{skull:'−X, dove X è il numero di nemici Ghoul nel tuo luogo.',cultist:'−1. Se fallisci, subisci 1 orrore.',tablet:'−2. Se c\'è un nemico Ghoul nel tuo luogo, subisci 1 danno.'},
            hard:{skull:'−2. Se fallisci, dopo la prova cerca nel mazzo e negli scarti degli incontri un Ghoul e pescalo.',cultist:'Rivela 1 altro segnalino. Se fallisci, subisci 2 orrori.',tablet:'−4. Se c\'è un nemico Ghoul nel tuo luogo, subisci 1 danno e 1 orrore.'}}},
  maschere:{n:'II · Le Maschere di Mezzanotte',
    agendas:[{n:'Predatore o Preda?',d:6,notes:{always:'Sulla trama c\'è un\'azione Abbandona: si può uscire dallo scenario tenendo ciò che si è scoperto.'}},
             {n:'Il Tempo Stringe',d:8,notes:{always:'Sulla trama c\'è un\'azione Abbandona: si può uscire dallo scenario tenendo ciò che si è scoperto.'}}],
    acts:[{n:'Smascherare la Cospirazione',obj:'Azione: il gruppo spende 2 indizi per investigatore → pesca la prima carta del mazzo dei cultisti. Obiettivo: 6 Cultisti unici nella galleria delle vittorie (non tutti sono nel mazzo dei cultisti).'}],
    tokens:{std:{skull:'−X, dove X è il destino più alto su un nemico Cultista in gioco.',cultist:'−2. Colloca 1 destino sul nemico Cultista più vicino.',tablet:'−3. Se fallisci, colloca 1 tuo indizio nel tuo luogo.'},
            hard:{skull:'−X, dove X è il destino totale in gioco.',cultist:'−2. Colloca 1 destino su ogni Cultista in gioco; se non ce ne sono, rivela 1 altro segnalino.',tablet:'−4. Se fallisci, colloca tutti i tuoi indizi nel tuo luogo.'}}},
  divoratore:{n:'III · Il Divoratore Sotterraneo',

function freshSetup(){return {scen:'adunanza',diff:'standard',invs:[{pick:'roland',player:'',tf:0,tm:0},{pick:'daisy',player:'',tf:0,tm:0}],lead:0,house:'piedi',priest:false,fuggiti:0,midnight:false,customD:8};}
function load(){try{const s=localStorage.getItem(LS);return s?JSON.parse(s):null}catch(e){return null}}
const LSS='ahlcg-salvataggi-v1';
function loadSaves(){try{return JSON.parse(localStorage.getItem(LSS)||'[]')}catch(e){return[]}}
function writeSaves(a){try{localStorage.setItem(LSS,JSON.stringify(a))}catch(e){}}
function upsertSave(g){const a=loadSaves();const rec={id:g.id,name:g.name,at:Date.now(),game:g};const i=a.findIndex(x=>x.id===g.id);
  if(i>=0)a[i]=rec;else a.unshift(rec);a.sort((x,y)=>y.at-x.at);writeSaves(a.slice(0,40));}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}if(S.game)upsertSave(S.game);}
function newId(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function defaultName(scen,names){const d=new Date();return `${SCEN[scen].n.replace(/^[IV]+ · /,'')} — ${names.join(', ')} — ${d.toLocaleDateString('it-IT')}`}
let S=load()||{setup:freshSetup(),game:null,tab:'round',draw:null};
S.drawing=false;S.justDrew=false;
document.getElementById('ver').textContent='v'+APP_VERSION;
if(S.game&&!S.game.id){S.game.id=newId();S.game.name=defaultName(S.game.scen,S.game.invs.map(v=>v.name));}
let UNDO=[];
const G=()=>S.game;
function mut(fn){if(S.game){UNDO.push(JSON.stringify(S.game));if(UNDO.length>80)UNDO.shift();}fn();save();render();}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function log(g,t){g.log.unshift({r:g.round,t});if(g.log.length>60)g.log.pop();}
function order(g){const n=g.invs.length;return g.invs.map((_,i)=>(g.lead+i)%n);}
function sc(g){return SCEN[g.scen]}
function agenda(g){return sc(g).agendas[g.agenda]}
function act(g){return sc(g).acts[g.act]}
function thr(g){const a=agenda(g);if(!a)return null;return a.d==null?g.customD:a.d;}
function totDoom(g){return g.doom+g.odoom}
function actReq(g){const a=act(g);return a&&a.c?a.c*g.invs.length:null}
function groupClues(g){return g.invs.filter(v=>!v.out).reduce((s,v)=>s+v.clues,0)}
function invName(v){return esc(v.name)+(v.player?` <span class="muted small">(${esc(v.player)})</span>`:'')}
function notes(g,kind){
  const out=[];const a=agenda(g),c=act(g);
  if(a&&a.notes&&a.notes[kind])out.push(a.notes[kind]);
  if(c&&c.notes&&c.notes[kind])out.push(c.notes[kind]);
  if(sc(g).ritual&&kind==='endRound'&&g.act>=1)out.push('Obbligo (Sito del Rituale, se in gioco): se ha meno di 2 indizi per investigatore, aggiungete indizi fino a quel numero.');

}

function steps(g){
  const P=g.phase,ord=order(g);
  if(P===-1)return[
    {t:'Preparazione generale',b:()=>checklist(g,'gen',generalSetup(g))},
    {t:'Preparazione dello scenario',b:()=>checklist(g,'scn',scenSetup(g))},
    {t:'Pronti',b:()=>`<p>Leggete la Trama 1a e il Capitolo 1a.</p><div class="note">Primo round: si salta la Fase dei Miti, si parte dalla Fase degli Investigatori.</div>`,next:'Inizia il round 1'}
  ];
  if(P===0)return[
    {t:'Inizio del round',b:()=>`<p>Inizia il round <b>${g.round}</b>. Si risolvono gli effetti «all'inizio del round» e «all'inizio della Fase dei Miti».</p>`},
    {t:'Colloca 1 destino sulla trama',b:()=>g.mDoom?`<div class="note okbox">Fatto: destino sulla trama ora ${g.doom}.</div>`:`<p>Mettete 1 segnalino destino sulla trama attuale.</p>`,
      prim:g.mDoom?null:{l:'+1 destino e continua',a:'mDoom'}},
    {t:'Controlla la soglia di destino',b:()=>{const t=thr(g),T=totDoom(g);
      if(t==null)return'<p class="muted">Nessuna trama attiva.</p>';
      return `<p>Destino in gioco: <b>${T}</b> (trama ${g.doom} + altre carte ${g.odoom}) · soglia <b>${t}</b>.</p>`+
      (T>=t?`<div class="note warn"><b>La trama prosegue!</b> Togliete tutto il destino in gioco, girate la trama e seguite il retro (se il retro è una carta incontro, si risolve come pescata).</div><button class="primary" data-a="advAgenda">Trama successiva</button>`
           :`<div class="note okbox">Sotto la soglia: non succede niente.</div>`)}},
    {t:'Pescate le carte incontro',b:()=>`<p class="small muted">In ordine di gioco, a partire dall'investigatore capo.</p>`+
      ord.map(i=>{const v=g.invs[i];if(v.out)return'';const on=g.drawn[i];
        return `<div class="check ${on?'done':''}" data-a="drawn" data-i="${i}"><span class="box">${CHK}</span><span class="lbl">${invName(v)}${i===g.lead?' <span class="badge">Capo</span>':''}</span></div>`}).join('')+
      `<ul class="bul small"><li><b>Rivelazione</b>: si risolve subito.</li><li><b>Nemico</b>: va dove dice «Generazione»; senza, è impegnato con chi l'ha pescato.</li><li><b>Sventura</b>: dopo la Rivelazione va negli scarti degli incontri, salvo diversa indicazione.</li><li><b>Impulso</b>: pescate un'altra carta. <b>Isolamento</b>: nessuno può aiutare chi l'ha pescata.</li></ul>`},
    {t:'Fine della Fase dei Miti',b:()=>`<p>Si risolvono gli effetti «alla fine della Fase dei Miti».</p><div class="note">Es. Mago dell'Ordine: +1 destino su di esso. Usa «Altre carte +» nella barra in alto.</div>`}
  ];
  if(P===1)return[
    {t:'Turni degli investigatori',b:()=>{
      let h=`<p class="small muted">Decidete voi l'ordine. Ognuno fa fino a 3 azioni; un turno iniziato va finito prima del successivo. Tocca i cerchi per segnare le azioni usate.</p>`;
      h+=ord.map(i=>invTurn(g,i)).join('');

      h+=`<div class="note warn small"><b>Attacchi di opportunità:</b> se sei impegnato con nemici pronti, ogni azione tranne Combattimento, Elusione, Abbandona/Negozia provoca un attacco da ognuno. Le carte Veloce non lo provocano.</div>`;
      return h;},
      next:()=>g.invs.every(v=>v.out||v.turnDone)?'Alla Fase dei Nemici':'Alla Fase dei Nemici (turni non chiusi)'}
  ];
  if(P===2)return[
    {t:'Movimento dei Cacciatori',b:()=>`<p>Ogni nemico <b>Cacciatore</b> pronto e non impegnato si muove di 1 luogo verso l'investigatore più vicino (percorso più breve).</p><ul class="bul small"><li>Non si muove se nel suo luogo c'è già un investigatore.</li><li>A parità decide la <b>Preda</b>, poi l'investigatore capo.</li><li>Se arriva pronto nel luogo di un investigatore, lo impegna.</li></ul>`,
      alt:{l:'Nessun nemico in gioco: salta la fase',a:'skipEnemy'}},
    {t:'Attacchi dei nemici',b:()=>`<p class="small muted">In ordine di gioco: ogni investigatore subisce l'attacco di ogni nemico pronto impegnato con lui, nell'ordine che sceglie. Dopo l'attacco il nemico si esaurisce.</p>`+

    {t:'Fine della Fase dei Nemici',b:()=>{const N=notes(g,'endEnemy');return `<p>Si risolvono gli effetti «alla fine della Fase dei Nemici».</p>`+(N.length?N.map(x=>`<div class="note warn">${x}</div>`).join(''):'<p class="muted small">Nessun effetto dello scenario da ricordare.</p>')}}
  ];
  return[

  ];
}

function invTurn(g,i){
  const v=g.invs[i];
  if(v.out)return `<div class="inv isout"><b>${invName(v)}</b> <span class="badge out">Eliminato</span></div>`;
  let pips='';for(let k=0;k<v.maxA;k++)pips+=`<button class="pip ${k<v.used?'used':''}" data-a="pip" data-i="${i}" data-v="${k}" aria-label="azione ${k+1}"></button>`;
  if(v.id==='daisy')pips+=`<button class="pip tome ${v.tome?'used':''}" data-a="tome" data-i="${i}" title="Azione Tomo"></button>`;
  const left=v.maxA-v.used;
  return `<div class="inv ${v.turnDone?'done':''}">
    <div class="row between"><div><b>${invName(v)}</b>${i===g.lead?' <span class="badge">Capo</span>':''}</div>
    <span class="small muted">${v.turnDone?'turno finito':left+' azion'+(left===1?'e':'i')+' rimast'+(left===1?'a':'e')}</span></div>
    ${v.turnDone?'':`<div class="pips">${pips}</div>
    <div class="row small muted"><span>💰 ${v.res}</span><span>🔍 ${v.clues}</span><span style="color:var(--hp)">♥ ${v.dmg}/${v.hp}</span><span style="color:var(--san)">✦ ${v.hor}/${v.san}</span></div>
    ${INV[v.id].ab?`<div class="small muted" style="margin-top:6px">${INV[v.id].ab}</div>`:''}
    <div class="row" style="margin-top:8px">
      <button class="sm" data-a="res" data-i="${i}" data-v="1">+1 risorsa</button>
      <button class="sm" data-a="clue" data-i="${i}" data-v="1">+1 indizio</button>
      <button class="sm" data-a="extra" data-i="${i}">+1 azione extra</button>
      ${v.id==='skids'&&!v.skidsUsed?`<button class="sm" data-a="skids" data-i="${i}" ${v.res<2?'disabled':''}>Skids: 2 risorse → +1 azione</button>`:''}
    </div>`}
    <div class="row" style="margin-top:8px">${v.turnDone?`<button class="sm ghost" data-a="reopen" data-i="${i}">Riapri turno</button>`:`<button class="sm primary" data-a="endTurn" data-i="${i}">Fine turno</button>`}</div>
  </div>`;
}

const ACTIONS_TABLE=`<table><tr><th>Azione</th><th>Effetto</th></tr>
<tr><td>Indagine</td><td>Intelletto vs Oscurità: se superi, 1 indizio dal luogo.</td></tr>
<tr><td>Movimento</td><td>Vai in un luogo collegato (se chiuso, aprilo e mettici gli indizi).</td></tr>

/* ===================== AZIONI ===================== */
function enterPhase(g,p){
  g.phase=p;g.step=0;
  if(p===0){g.drawn={};g.mDoom=false;}
  if(p===1)g.invs.forEach(v=>{v.used=0;v.maxA=3;v.tome=0;v.turnDone=false;v.skidsUsed=false;});
  if(p===2)g.atk={};
  if(p===3)g.resGiven=false;
}
function goNext(g){
  const st=steps(g);
  if(g.step<st.length-1){g.step++;return;}
  if(g.phase===-1){g.round=1;enterPhase(g,1);log(g,'Inizio round 1 (si salta la Fase dei Miti)');return;}
  if(g.phase===3){g.round++;enterPhase(g,0);log(g,'Inizio round '+g.round);return;}
  enterPhase(g,g.phase+1);
}
function goPrev(g){
  if(g.step>0){g.step--;return;}
  if(g.phase===-1)return;
  if(g.phase===1&&g.round===1){g.phase=-1;g.step=steps(g).length-1;return;}
  if(g.phase===0){g.round--;g.phase=3;g.step=steps(g).length-1;return;}
  g.phase--;g.step=steps(g).length-1;
}
function advAgenda(g){
  const a=agenda(g);log(g,`Trama ${g.agenda+1} (${a?a.n:''}) prosegue — tolto tutto il destino`);
  g.agenda++;g.doom=0;g.odoom=0;
}
function advAct(g){const a=act(g);log(g,`Capitolo ${g.act+1} (${a?a.n:''}) completato`);g.act++;}

function startGame(){
  const s=S.setup;
  const g={scen:s.scen,diff:s.diff,lead:Math.min(s.lead,s.invs.length-1),round:0,phase:-1,step:0,agenda:0,act:0,doom:0,odoom:0,
    customD:s.customD||8,log:[],drawn:{},atk:{},checks:{},resGiven:false,mDoom:false,
    cond:{house:s.house,priest:s.priest,fuggiti:s.fuggiti,midnight:s.midnight},
    invs:s.invs.map(r=>{const d=INV[r.pick];const custom=r.pick==='altro';
      return {id:r.pick,name:custom?(r.cname||'Investigatore'):d.n,player:r.player||'',hp:custom?(+r.chp||7):d.hp,san:custom?(+r.csan||7):d.san,
        dmg:+r.tf||0,hor:+r.tm||0,res:5,clues:0,used:0,maxA:3,tome:0,turnDone:false,skidsUsed:false,out:false};})};
  if(s.scen==='divoratore'){const f=+s.fuggiti;g.doom=f==0?0:f<=2?1:f<=4?2:3;}
  g.id=newId();g.name=(s.name||'').trim()||defaultName(s.scen,g.invs.map(v=>v.name));s.name='';
  log(g,'Partita iniziata: '+SCEN[g.scen].n+' · '+DIFF[g.diff].n);
  UNDO=[];S.game=g;S.tab='round';save();render();window.scrollTo(0,0);
}

const H={
  undo(){if(!UNDO.length)return;S.game=JSON.parse(UNDO.pop());save();render();},
  menu(){openMenu();},
  tab(e){S.tab=e.dataset.v;save();render();window.scrollTo(0,0);},
  next(){mut(()=>goNext(G()));window.scrollTo(0,0);},
  prev(){mut(()=>goPrev(G()));window.scrollTo(0,0);},
  chk(e){mut(()=>{const g=G(),k=e.dataset.v;g.checks[k]=!g.checks[k];});},

  skids(e){mut(()=>{const g=G(),v=g.invs[e.dataset.i];if(v.res<2)return;v.res-=2;v.maxA++;v.skidsUsed=true;log(g,'Skids spende 2 risorse per 1 azione extra');});},

  out(e){mut(()=>{const g=G(),v=g.invs[e.dataset.i];v.out=!v.out;log(g,v.name+(v.out?' eliminato (sconfitto o ha abbandonato)':' rientra'));});},
  lead(e){mut(()=>{G().lead=+e.dataset.i;});},
  draw(){if(S.drawing)return;const g=G();const bag=bagOf(g?g.scen:S.setup.scen,g?g.diff:S.setup.diff);

    try{navigator.clipboard.writeText(t.value).then(done,()=>{try{document.execCommand('copy');done();}catch(_){}});}catch(_){try{document.execCommand('copy');done();}catch(__){}}},
  dlFile(){try{const g=JSON.parse(decodeCode(document.getElementById('code').value));

    a.href=URL.createObjectURL(b);a.download=(g.name||'partita').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_')+'.arkham.json';document.body.appendChild(a);a.click();a.remove();}catch(e){}},

function encodeCode(g){return btoa(unescape(encodeURIComponent(JSON.stringify(g))));}
function decodeCode(t){t=t.trim();if(t.startsWith('{'))return t;return decodeURIComponent(escape(atob(t.replace(/\s+/g,''))));}
function importText(t){
  const msg=document.getElementById('impMsg');
  try{const g=JSON.parse(decodeCode(t));if(!g||!g.invs||!g.scen||!SCEN[g.scen])throw 0;
    if(!g.id)g.id=newId();if(!g.name)g.name=defaultName(g.scen,g.invs.map(v=>v.name));
    if(S.game)upsertSave(S.game);S.game=g;UNDO=[];S.tab='round';closeModal();save();render();window.scrollTo(0,0);}
  catch(e){if(msg)msg.textContent='Codice o file non valido.';}
}

};

function render(){
  const app=document.getElementById('app');
  document.getElementById('undoBtn').style.visibility=(S.game&&UNDO.length)?'visible':'hidden';
  const tabs=[['round','Round'],['team','Squadra'],['bag','Caos'],['rules','Regole']];
  document.getElementById('tabs').innerHTML=tabs.map(([k,l])=>`<button class="${S.tab===k?'on':''}" data-a="tab" data-v="${k}">${ICONS[k]}${l}</button>`).join('');
  if(S.tab==='bag'){app.innerHTML=renderBag();return;}
  if(S.tab==='rules'){app.innerHTML=RULES;return;}

  app.innerHTML=S.tab==='team'?renderTeam():renderRound();

function statusBar(g){

  const pct=t?Math.min(100,T/t*100):0;
  return `<div class="status">
  <div class="row between"><h2>${g.phase===-1?'Preparazione':'Round '+g.round}</h2><span class="small muted">${esc(sc(g).n)} · ${DIFF[g.diff].n}</span></div>
  ${g.phase>=0?`<div class="phases">${phases}</div>`:''}
  <div class="card" style="margin:0">
    <div class="row between"><span class="lab small muted">TRAMA ${a?g.agenda+1+' · '+esc(a.n):'—'}</span>

    ${a?`<div class="meter" style="margin:6px 0"><span class="big" style="color:var(--doom)">${T}<span class="muted" style="font-size:1rem">/${t}</span></span><div class="bar"><i style="width:${pct}%"></i></div></div>
    <div class="row between small">
      <div class="ctr"><button data-a="doom" data-v="-1">−</button><span class="v">${g.doom}</span><button data-a="doom" data-v="1">+</button><span class="muted">trama</span></div>
      <div class="ctr"><button data-a="odoom" data-v="-1">−</button><span class="v">${g.odoom}</span><button data-a="odoom" data-v="1">+</button><span class="muted">altre carte</span></div>
    </div>
    ${T>=t&&!(g.phase===0&&g.step===2)?`<div class="note warn small">Soglia raggiunta. La trama prosegue nel passo «Controlla la soglia» della Fase dei Miti, salvo carte che dicono esplicitamente che possono farla proseguire (es. Mali Antichi).<div style="margin-top:6px"><button class="sm danger" data-a="advAgenda">Prosegui ora con la trama</button></div></div>`:''}`
    :`<div class="note small">Ultima trama superata: seguite il retro della carta.</div>`}
  </div>
  <div class="card" style="margin:0">
    <div class="row between"><span class="small muted">CAPITOLO ${c?g.act+1+' · '+esc(c.n):'—'}</span>${c?`<button class="sm" data-a="advAct">Prosegui ✓</button>`:''}</div>
    ${c?(req!=null?`<div class="row small" style="margin-top:4px"><span>Indizi richiesti: <b>${req}</b></span><span class="muted">· il gruppo ne ha <b style="color:${gc>=req?'var(--ok)':'var(--clue)'}">${gc}</b></span></div><div class="small muted">Si spendono in qualsiasi momento del vostro turno, senza azioni; poi toglieteli dalle schede in «Squadra».</div>`
      :`<div class="small" style="margin-top:4px">${c.obj}</div>`):`<div class="small muted">Nessun capitolo successivo: seguite il retro.</div>`}
  </div></div>`;
}

function renderRound(){
  const g=G(),st=steps(g),s=st[Math.min(g.step,st.length-1)];
  const nextL=typeof s.next==='function'?s.next():(s.next||'Avanti');
  const phaseName=g.phase===-1?'Preparazione':'Fase '+(g.phase===1?'degli ':'dei ')+PH[g.phase].replace('Gestione','')+(g.phase===3?'di Gestione':'');
  let h=statusBar(g);
  h+=`<div class="card"><div class="steph"><h3 class="grow">${s.t}</h3><span class="stepn">${phaseName.replace('Fase dei di Gestione','Fase di Gestione')} · passo ${g.step+1}/${st.length}</span></div>${s.b()}
  ${s.alt?`<div style="margin-top:10px"><button data-a="${s.alt.a}">${s.alt.l}</button></div>`:''}
  <div class="navbtns"><button data-a="prev" ${g.phase===-1&&g.step===0?'disabled':''}>‹ Indietro</button>
  ${s.prim?`<button class="primary" data-a="${s.prim.a}">${s.prim.l}</button><button data-a="next">Salta ›</button>`:`<button class="primary" data-a="next">${nextL} ›</button>`}</div></div>`;
  h+=`<details><summary>Registro degli eventi</summary><ul class="clean log">${g.log.map(l=>`<li>R${l.r} · ${esc(l.t)}</li>`).join('')}</ul></details>`;
  return h;
}

  ${scen==='divoratore'?'<div class="small muted" style="margin-top:6px">Include il segnalino Antico aggiunto per questo scenario (resta per il resto della campagna).</div>':''}</div>`;
  h+=`<div class="card"><h3>Effetti dei simboli (lato ${side==='std'?'Facile/Standard':'Difficile/Esperto'})</h3><table>
  ${['skull','cultist','tablet'].concat(T&&T[side].elder?['elder']:[]).map(t=>`<tr><td class="tkcell">${tokDisc(t,'sm')}<span>${TK[t]}</span></td><td>${tokEffect(scen,diff,t)}</td></tr>`).join('')}
  <tr><td class="tkcell">${tokDisc('sign','sm')}<span>Simbolo degli Antichi</span></td><td>Effetto dell'investigatore (vedi «Squadra»).</td></tr>
  <tr><td class="tkcell">${tokDisc('fail','sm')}<span>Fallimento automatico</span></td><td>La prova fallisce.</td></tr></table></div>`;
  h+=`<details><summary>Prova di abilità, passo per passo</summary><ol class="small" style="padding-left:20px;margin:0">
  <li>Si sceglie l'abilità e la difficoltà.</li><li>Investite carte con l'icona giusta o jolly: chi fa la prova quante vuole, ogni altro investigatore nello stesso luogo 1 carta. +1 per icona.</li>
  <li>Rivelate 1 segnalino e applicate il suo effetto.</li><li>Valore = abilità + icone + segnalino + capacità (minimo 0).</li>
  <li>Valore ≥ difficoltà → successo. Applicate i risultati.</li><li>Scartate le carte investite e rimettete il segnalino nel sacchetto.</li></ol></details>`;
  return h;
}

function renderSetup(){
  const s=S.setup;
  const opt=(k)=>`<div class="opt ${s.scen===k?'on':''}" data-a="scen" data-v="${k}"><b>${esc(SCEN[k].n)}</b></div>`;
  let h=savesCard(false)+`<h2 style="margin-bottom:4px">Nuova partita</h2><p class="small muted">Imposta scenario e investigatori: l'app ti guida poi nella preparazione e in ogni fase del round.</p>
  <div class="card"><label class="f" style="margin-top:0">Nome della partita</label><input type="text" data-f="name" value="${esc(s.name||'')}" placeholder="facoltativo, es. Campagna con Marco e Giulia"></div>
  <div class="card"><h3>Scenario</h3><div class="opts">${Object.keys(SCEN).map(opt).join('')}</div>
  <label class="f">Difficoltà</label><select data-f="diff">${Object.entries(DIFF).map(([k,d])=>`<option value="${k}" ${s.diff===k?'selected':''}>${d.n}</option>`).join('')}</select></div>`;
  h+=`<div class="card"><div class="row between"><h3>Investigatori (${s.invs.length})</h3>${s.invs.length<4?'<button class="sm" data-a="addInv">+ Aggiungi</button>':''}</div>`;
  s.invs.forEach((r,i)=>{
    h+=`<div class="invrow"><div class="row between"><b>Giocatore ${i+1}</b>${s.invs.length>1?`<button class="sm ghost" data-a="delInv" data-i="${i}">Rimuovi</button>`:''}</div>
    <div class="grid2"><div><label class="f">Investigatore</label><select data-f="pick" data-i="${i}">${Object.entries(INV).map(([k,d])=>`<option value="${k}" ${r.pick===k?'selected':''}>${esc(d.n)}</option>`).join('')}</select></div>
    <div><label class="f">Nome giocatore</label><input type="text" data-f="player" data-i="${i}" value="${esc(r.player||'')}" placeholder="facoltativo"></div></div>
    ${r.pick==='altro'?`<div class="grid2"><div><label class="f">Nome investigatore</label><input type="text" data-f="cname" data-i="${i}" value="${esc(r.cname||'')}"></div><div class="grid2"><div><label class="f">Salute</label><input type="number" data-f="chp" data-i="${i}" value="${r.chp||7}"></div><div><label class="f">Sanità</label><input type="number" data-f="csan" data-i="${i}" value="${r.csan||7}"></div></div></div>`:''}
    <div class="grid2"><div><label class="f">Trauma fisico</label><input type="number" min="0" data-f="tf" data-i="${i}" value="${r.tf||0}"></div><div><label class="f">Trauma mentale</label><input type="number" min="0" data-f="tm" data-i="${i}" value="${r.tm||0}"></div></div></div>`;
  });
  const dup=s.invs.map(r=>r.pick).filter((p,i,a)=>p!=='altro'&&a.indexOf(p)!==i);
  if(dup.length)h+=`<div class="note warn small">Ogni giocatore deve usare un investigatore diverso.</div>`;
  h+=`<label class="f">Investigatore capo</label><select data-f="lead">${s.invs.map((r,i)=>`<option value="${i}" ${s.lead==i?'selected':''}>Giocatore ${i+1} — ${esc(r.pick==='altro'?(r.cname||'Altro'):INV[r.pick].n)}</option>`).join('')}</select>
  <p class="small muted">Ordine di gioco: il capo, poi in senso orario (l'ordine della lista).</p></div>`;
  if(s.scen==='maschere'||s.scen==='divoratore'){
    h+=`<div class="card"><h3>Dal Diario della Campagna</h3>`;
    if(s.scen==='maschere')h+=`<label class="f">La vostra casa</label><select data-f="house"><option value="piedi" ${s.house==='piedi'?'selected':''}>È ancora in piedi</option><option value="rasa" ${s.house==='rasa'?'selected':''}>È stata rasa al suolo</option></select>`;
    if(s.scen==='divoratore')h+=`<label class="f">Nomi sotto «Cultisti Fuggiti»</label><div class="ctr"><button data-a="fug" data-v="-1">−</button><span class="v">${s.fuggiti}</span><button data-a="fug" data-v="1">+</button></div>
      <div class="check ${s.midnight?'done':''}" data-a="setTog" data-v="midnight"><span class="box">${CHK}</span><span class="lbl">È passata la mezzanotte</span></div>`;
    h+=`<div class="check ${s.priest?'done':''}" data-a="setTog" data-v="priest"><span class="box">${CHK}</span><span class="lbl">Il Ghoul Sacerdote è ancora vivo</span></div></div>`;
  }
  h+=`<button class="primary" style="width:100%;min-height:50px" data-a="start" ${dup.length?'disabled':''}>Inizia la preparazione ›</button>`;
  return h;
}
H.setTog=e=>{const k=e.dataset.v;S.setup[k]=!S.setup[k];save();render();};

const RULES=`<h2 style="margin-bottom:10px">Regole rapide</h2>
<details open><summary>Sequenza del round</summary><ol class="small" style="padding-left:20px;margin:0">
<li><b>Miti</b> (non al 1° round): +1 destino sulla trama → controllo soglia → ognuno pesca 1 carta incontro.</li>
<li><b>Investigatori</b>: ognuno fa un turno di 3 azioni, nell'ordine che volete.</li>
<li><b>Nemici</b>: i Cacciatori si muovono → i nemici pronti e impegnati attaccano.</li>
<li><b>Gestione</b>: ripristino → 1 carta e 1 risorsa a testa → limite di mano 8.</li></ol></details>
<details><summary>Azioni</summary>${ACTIONS_TABLE}
<div class="note small"><b>Attacchi di opportunità:</b> se sei impegnato con nemici pronti, ogni azione tranne Combattimento, Elusione e capacità Abbandona/Negozia provoca un attacco da ognuno, dopo aver pagato i costi e prima dell'effetto. Non esauriscono il nemico. Una capacità che costa più azioni provoca un solo attacco.</div></details>
<details><summary>Nemici</summary><ul class="bul small">
<li>Ti impegna se: generato pronto nel tuo luogo, si ripristina nel tuo luogo, si muove pronto nel tuo luogo, o entri tu nel suo.</li>
<li><b>Preda</b>: decide chi impegna o chi insegue a parità.</li>
<li><b>Cacciatore</b>: si muove nella Fase dei Nemici verso l'investigatore più vicino.</li>
<li><b>Ritorsione</b>: se fallisci un attacco contro di lui mentre è pronto, ti attacca.</li>
<li><b>Massiccio</b>: impegnato con tutti nel suo luogo, non ti segue.</li>
<li>Attacco fallito contro un nemico impegnato con un compagno: il danno va al compagno.</li>
<li>Sconfitto → scarti degli incontri; con Vittoria → galleria delle vittorie.</li></ul></details>
<details><summary>Danni, orrori e sconfitta</summary><ul class="bul small">
<li>Si assegnano su investigatore e supporti con Salute/Sanità; i danni/orrori <b>diretti</b> solo sull'investigatore.</li>
<li>Danni ≥ Salute o orrori ≥ Sanità → sconfitto: 1 trauma fisico o mentale.</li>
<li>Chi abbandona non è sconfitto e non subisce traumi.</li>
<li>Eliminato: le sue carte escono, gli indizi restano nel luogo, i nemici si disimpegnano ma restano lì.</li>
<li>Gli eliminati contano ancora per i valori «per investigatore».</li></ul></details>
<details><summary>Parole chiave</summary><ul class="bul small">
<li><b>Impulso</b>: pesca un'altra carta incontro.</li><li><b>Isolamento</b>: nessun aiuto da altri per quella carta.</li>
<li><b>Veloce</b>: non costa azioni.</li><li><b>Utilizzo (X)</b>: X segnalini (munizioni, cariche…), non risorse.</li>
<li><b>Unico (•)</b>: una sola copia in gioco.</li><li><b>Obbligo</b>: si risolve da solo, prima delle reazioni.</li>
<li><b>Per investigatore</b>: moltiplica per chi ha iniziato lo scenario.</li>
<li><b>Regola nera</b>: nel dubbio, la soluzione peggiore per gli investigatori.</li></ul></details>
<details><summary>Fine dello scenario</summary><ul class="bul small">
<li>Galleria delle vittorie: nemici e sventure con Vittoria, più i <b>luoghi con Vittoria in gioco, aperti e senza indizi</b>.</li>
<li>XP = punti Vittoria + bonus della risoluzione.</li>
<li>Carta nuova: XP pari al livello (minimo 1). Miglioramento: differenza di livello.</li></ul></details>
<p class="small muted">Fonte: Compendio delle Regole e Guida alla Campagna. Il testo delle carte prevale sempre.</p>`;

function setField(el,rerender){
  const f=el.dataset.f,i=el.dataset.i,v=el.value;
  if(i!=null){const r=S.setup.invs[+i];r[f]=(['tf','tm','chp','csan'].includes(f))?Math.max(0,+v||0):v;}

  save();if(rerender)render();
}

function fileToDataURL(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{
  const max=640,sc=Math.min(1,max/Math.max(im.width,im.height));const cv=document.createElement('canvas');cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);
  cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);let q=.85,d=cv.toDataURL('image/jpeg',q);while(d.length>600000&&q>.4){q-=.1;d=cv.toDataURL('image/jpeg',q);}res(d);};
  im.onerror=()=>rej(new Error('file non leggibile come immagine'));im.src=fr.result;};fr.onerror=()=>rej(fr.error);fr.readAsDataURL(file);});}
function pickFiles(multiple){return new Promise(res=>{const inp=document.createElement('input');inp.type='file';inp.accept='image/*';if(multiple)inp.multiple=true;

  wendy:[14,44,45,46,47,48,49,72,73,74,75,76,77,86,86,87,87,50,51,52,78,79,80,88,88,53,81,91,91,93,93,15],
  altro:[]
};
const INV_CARD={roland:1,daisy:2,skids:3,agnes:4,wendy:5};
const BASIC_WK=[96,96,97,97,98,99,100,101,102,103];
const CNT=['res','clues','dmg','hor'];
const ABS=['used','maxA','tome','turnDone','skidsUsed','out'];
const PABS=ABS.concat(['inplay','threat','deck','deckList','deckMode']);
const TYPE_IT={investigator:'Investigatore',asset:'Supporto',event:'Evento',skill:'Abilità',treachery:'Sventura',enemy:'Nemico'};
const FAC_IT={G:'Guardiano',S:'Studioso',C:'Canaglia',M:'Mistico',V:'Sopravvissuto',N:'Neutrale'};
const ICN={w:'Vol',i:'Int',c:'Sco',a:'Agi',x:'Jolly'};

let sb=null,CONN={id:null,chan:null,status:'off'},REMOTE={},LAST_DRAW_N=null,OWN_DRAW=false,POLL=null;
const PL={on:false,code:null,slot:null,pack:null,err:'',weak:null,tab:'pscheda'};
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=()=>Math.random().toString(36).slice(2,9);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function client(){
  if(sb)return sb;
  if(!window.supabase||!window.supabase.createClient)throw new Error('libreria di Supabase non caricata: controlla la connessione');
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
  return sb;
}
async function rpc(fn,args){const {data,error}=await client().rpc(fn,args);if(error)throw new Error(error.message);return data;}

/* ---------- coda di scrittura ---------- */
const Q=[];let qBusy=false;
function enqueue(ops){if(!ops.length)return;Q.push(...ops);runQ();}
async function runQ(){
  if(qBusy)return;qBusy=true;
  while(Q.length){const [fn,args]=Q.shift();try{await rpc(fn,args);}catch(e){toast('Sincronizzazione non riuscita: '+e.message,true);}}
  qBusy=false;ping();refetch();
}
function ping(){if(CONN.chan)CONN.chan.send({type:'broadcast',event:'ping',payload:{}}).catch(()=>{});}

/* ---------- connessione realtime ---------- */
function targetId(){return PL.on?(PL.pack&&PL.pack.game_id):(S.game&&S.game.online?S.game.online.id:null);}
function ensureConn(){
  refreshImgList();
  const id=targetId();
  if(CONN.id===id)return;
  if(CONN.chan){try{client().removeChannel(CONN.chan);}catch(e){}}
  CONN={id,chan:null,status:id?'connecting':'off'};LAST_DRAW_N=null;REMOTE={};
  clearInterval(POLL);POLL=null;
  if(!id)return;
  try{
    const ch=client().channel('ah-'+id,{config:{broadcast:{self:false}}});
    ch.on('broadcast',{event:'ping'},()=>refetchSoon());
    ch.subscribe(st=>{CONN.status=st==='SUBSCRIBED'?'on':(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED')?'err':'connecting';paintConn();});
    CONN.chan=ch;
  }catch(e){CONN.status='err';}
  POLL=setInterval(()=>refetch(),20000);
  refetch();
}
let rfT=null;function refetchSoon(){clearTimeout(rfT);rfT=setTimeout(refetch,150);}
async function refetch(){
  if(qBusy||Q.length)return;
  try{
    if(PL.on){
      if(!PL.code)return;
      const pack=await rpc('ah_player_get',{p_code:PL.code});
      if(qBusy||Q.length)return;
      PL.pack=pack;PL.slot=pack.slot;PL.err='';handleDraw(pack.draw);
      if(CONN.id!==pack.game_id)ensureConn();
      render();
    }else{
      const g=S.game;if(!g||!g.online)return;
      const pack=await rpc('ah_host_get',{p_token:g.online.token});
      if(qBusy||Q.length||S.game!==g)return;
      applyHost(g,pack);handleDraw(pack.draw);save();render();
    }
    if(CONN.status==='err')CONN.status='on';
  }catch(e){
    if(PL.on){PL.err=e.message;render();}
    else toast('Tavolo online non raggiungibile: '+e.message,true);
  }
}
function applyHost(g,pack){
  const adj=(snapFn)=>{UNDO=UNDO.map(s=>{const o=JSON.parse(s);snapFn(o);return JSON.stringify(o);});};
  const dd=pack.doom-g.doom,od=pack.odoom-g.odoom;
  const changes=[];
  Object.entries(pack.players||{}).forEach(([slot,p])=>{
    const i=+slot.slice(1),v=g.invs[i];if(!v)return;REMOTE[slot]=p.data;
    CNT.forEach(f=>{const d=(p.data[f]||0)-(v[f]||0);if(d)changes.push([i,f,d]);});
    ABS.forEach(f=>{if(p.data[f]!==undefined&&JSON.stringify(p.data[f])!==JSON.stringify(v[f]))changes.push([i,f,null,p.data[f]]);});
  });
  const apply=o=>{o.doom=Math.max(0,o.doom+dd);o.odoom=Math.max(0,o.odoom+od);
    changes.forEach(([i,f,d,val])=>{if(!o.invs[i])return;if(d!==null)o.invs[i][f]=Math.max(0,(o.invs[i][f]||0)+d);else o.invs[i][f]=val;});};
  if(dd||od||changes.length){apply(g);adj(apply);}
}
function handleDraw(d){
  if(!d){LAST_DRAW_N=0;return;}
  if(LAST_DRAW_N===null){LAST_DRAW_N=d.n;return;}
  if(d.n===LAST_DRAW_N)return;
  LAST_DRAW_N=d.n;
  if(OWN_DRAW){OWN_DRAW=false;return;}
  S.draw=d.t;const onBag=PL.on?PL.tab==='bag':S.tab==='bag';S.justDrew=onBag;
  toast(`${d.who||'Qualcuno'} ha pescato: ${TK[d.t]||d.t}`);
}

/* ---------- toast ---------- */
function toast(msg,bad){
  let el=document.getElementById('toast');
  if(!el){el=document.createElement('div');el.id='toast';document.body.appendChild(el);}
  el.textContent=msg;el.className='on'+(bad?' bad':'');clearTimeout(el._t);el._t=setTimeout(()=>el.className='',bad?5000:3200);
}
function paintConn(){
  const el=document.getElementById('conn');if(!el)return;
  const st=CONN.id?CONN.status:'off';
  el.className='conn '+st;el.title={on:'Tavolo online collegato',connecting:'Collegamento…',err:'Tavolo online non raggiungibile',off:''}[st];
  el.style.display=st==='off'?'none':'inline-block';
}

/* ---------- lato guida ---------- */
function pubState(g){return {scen:g.scen,diff:g.diff,lead:g.lead,round:g.round,phase:g.phase,step:g.step,agenda:g.agenda,act:g.act,customD:g.customD,mDoom:g.mDoom,resGiven:g.resGiven,name:g.name,log:g.log.slice(0,15),cond:g.cond};}
function syncHost(a,b){
  if(!a||!b||!b.online||a.id!==b.id)return;
  const tok=b.online.token,ops=[];
  if(b.doom!==a.doom)ops.push(['ah_doom',{p_auth:tok,p_field:'doom',p_delta:b.doom-a.doom}]);
  if(b.odoom!==a.odoom)ops.push(['ah_doom',{p_auth:tok,p_field:'odoom',p_delta:b.odoom-a.odoom}]);
  b.invs.forEach((vb,i)=>{const va=a.invs[i];if(!va)return;const slot='s'+i;
    CNT.forEach(f=>{if(vb[f]!==va[f])ops.push(['ah_host_delta',{p_token:tok,p_slot:slot,p_field:f,p_delta:vb[f]-va[f]}]);});
    const patch={};ABS.forEach(f=>{if(JSON.stringify(vb[f])!==JSON.stringify(va[f]))patch[f]=vb[f];});
    if(Object.keys(patch).length)ops.push(['ah_host_patch_player',{p_token:tok,p_slot:slot,p_patch:patch}]);});
  if(JSON.stringify(pubState(a))!==JSON.stringify(pubState(b)))ops.push(['ah_host_set_state',{p_token:tok,p_state:pubState(b)}]);
  enqueue(ops);
}
function defaultDeck(inv){const d=(DECKS[inv]||[]).slice();if(d.length)d.push(BASIC_WK[Math.floor(Math.random()*BASIC_WK.length)]);return d;}
function playerData(g,i){const v=g.invs[i];
  return {inv:v.id,name:v.name,player:v.player,hp:v.hp,san:v.san,res:v.res,clues:v.clues,dmg:v.dmg,hor:v.hor,
    used:v.used,maxA:v.maxA,tome:v.tome,turnDone:v.turnDone,skidsUsed:v.skidsUsed,out:v.out,
    deckMode:'fisico',deckList:v.deckList||defaultDeck(v.id),inplay:[],threat:[],deck:null};}
async function createTable(){
  const g=S.game;const btn=document.getElementById('mkTable');if(btn){btn.disabled=true;btn.textContent='Creo il tavolo…';}
  try{
    const r=await rpc('ah_create_game',{p_state:pubState(g),p_doom:g.doom,p_odoom:g.odoom});
    const codes={};
    for(let i=0;i<g.invs.length;i++)codes['s'+i]=await rpc('ah_host_add_player',{p_token:r.token,p_slot:'s'+i,p_data:playerData(g,i)});
    g.online={id:r.game_id,token:r.token,codes};
    if(LIBKEY){try{await rpc('ah_host_set_lib',{p_token:r.token,p_key:LIBKEY});g.online.lib=LIBKEY;}catch(e){}}
    log(g,'Tavolo online creato');save();render();openTable();
  }catch(e){const m=document.getElementById('tblErr');if(m)m.textContent='Non riesco a creare il tavolo: '+e.message;if(btn){btn.disabled=false;btn.textContent='Crea il tavolo online';}}
}
function joinLink(code){return location.origin+location.pathname+'?codice='+code;}

      <div class="row" style="margin-top:8px;align-items:flex-start"><div class="qr" id="qr${i}"></div><div class="grow small"><div class="muted" style="word-break:break-all">${esc(joinLink(c))}</div>

/* ---------- lato giocatore ---------- */
function me(){return PL.pack&&PL.pack.players[PL.slot]?PL.pack.players[PL.slot].data:null;}
function pseudo(){
  const p=PL.pack;if(!p)return null;
  const slots=Object.keys(p.players).sort((a,b)=>+a.slice(1)-+b.slice(1));
  return Object.assign({log:[],checks:{},drawn:{},atk:{}},p.state,{doom:p.doom,odoom:p.odoom,invs:slots.map(s=>Object.assign({slot:s},p.players[s].data))});
}
function pmut(fn){
  const m=me();if(!m)return;const before=clone(m);fn(m);render();
  const ops=[];
  CNT.forEach(f=>{const d=(m[f]||0)-(before[f]||0);if(d)ops.push(['ah_player_delta',{p_code:PL.code,p_field:f,p_delta:d}]);});
  const patch={};PABS.forEach(f=>{if(JSON.stringify(m[f])!==JSON.stringify(before[f]))patch[f]=m[f]===undefined?null:m[f];});
  if(Object.keys(patch).length)ops.push(['ah_player_patch',{p_code:PL.code,p_patch:patch}]);
  enqueue(ops);
}
function pdoom(field,delta){const p=PL.pack;p[field]=Math.max(0,p[field]+delta);render();enqueue([['ah_doom',{p_auth:PL.code,p_field:field,p_delta:delta}]]);}
async function joinTable(code){
  code=(code||'').trim().toUpperCase();if(!code)return;
  PL.on=true;PL.code=code;PL.err='';PL.pack=null;PL.tab='pscheda';
  try{localStorage.setItem('ahlcg-codice',code);}catch(e){}
  render();await refetch();ensureConn();
}
function leaveTable(){
  PL.on=false;PL.code=null;PL.pack=null;try{localStorage.removeItem('ahlcg-codice');}catch(e){}
  if(location.search){try{history.replaceState(null,'',location.pathname);}catch(e){}}
  ensureConn();closeModal();render();
}

/* ---------- carte ---------- */
function icons(c){return c.ic&&c.t!=='investigator'?Object.entries(c.ic).map(([k,n])=>`<span class="ico ico-${k}">${ICN[k]}${n>1?'×'+n:''}</span>`).join(''):'';}
function cardLine(c){
  const bits=[TYPE_IT[c.t]||c.t,FAC_IT[c.f]];
  if(c.c!=null)bits.push('Costo '+costTxt(c.c));if(c.l)bits.push('Liv. '+c.l);if(c.s)bits.push(c.s);
  if(c.t==='asset'&&(c.hp||c.san))bits.push(`♥${c.hp||'–'} ✦${c.san||'–'}`);
  if(c.t==='enemy')bits.push(`Sco ${c.ef} · Sal ${c.hp} · Agi ${c.ee} · Danni ${c.ed||0} Orrori ${c.eh||0}`);
  if(c.wk)bits.push(c.wk===2?'Debolezza base':'Debolezza');
  return bits.filter(Boolean).join(' · ');
}
function cardText(c){return (c.tx||'').replace(/\n/g,'<br>');}
function cardBody(c){return `<div class="small muted">${esc(cardLine(c))}</div>${c.tr?`<div class="small"><i>${esc(c.tr)}</i></div>`:''}<div class="ctext">${cardText(c)}</div>${icons(c)?`<div style="margin-top:4px">${icons(c)}</div>`:''}`;}
function cardName(c,plain){const nm=(c.u?'• ':'')+esc(c.n)+(c.sub?` <span class="muted small">— ${esc(c.sub)}</span>`:'');
  return plain?nm:`<span class="clink" data-a="cardview" data-v="${c.id}" title="Vedi la carta">${cardThumb(c)}<span>${nm}</span></span>`;}
function cardThumb(c){return `<span class="cthumb f-${c.f}${c.wk?' wk':''}${IMGLIST.has(adbCode(c.id))?' hasimg':''}">${c.c!=null&&c.t!=='investigator'?costTxt(c.c):''}</span>`;}
function costTxt(v){return v<0?'X':v;}
function adbCode(id){return typeof id==='number'||/^\d{1,3}$/.test(String(id))?'01'+String(id).padStart(3,'0'):String(id);}
function cardFrame(c){
  const lv=c.l?'<span class="cf-lvl">'+'●'.repeat(c.l)+'</span>':'';

  if(c.s)bot.push('Slot: '+esc(c.s));

   <div class="cf-top">${c.c!=null&&c.t!=='investigator'?`<span class="cf-cost">${costTxt(c.c)}</span>`:'<span class="cf-cost empty"></span>'}

function renderPSheet(m){
  const ic=CARD[INV_CARD[m.inv]];const d=INV[m.inv]||INV.altro;
  const ctr=(f,val,max)=>`<div class="ctr"><button data-a="pcnt" data-v="${f}|-1">−</button><span class="v">${val}${max!=null?'<span class="muted">/'+max+'</span>':''}</span><button data-a="pcnt" data-v="${f}|1">+</button></div>`;

  <div class="stats">

  h+=`<div class="card"><div class="row between"><h3>Il tuo turno</h3><span class="small muted">${myTurnPhase?(m.turnDone?'turno finito':(m.maxA-m.used)+' azioni rimaste'):'non è la Fase degli Investigatori'}</span></div>

  if(ic)h+=`<div class="card"><h3>Capacità</h3><div class="ctext">${cardText(ic)}</div></div>`;
  else h+=`<div class="card"><h3>Simbolo degli Antichi</h3><div class="small">${esc(d.es)}</div></div>`;
  h+=`<div class="card"><div class="row between"><h3>Area di minaccia</h3><button class="sm" data-a="pthreatAdd">+ Aggiungi</button></div>`+
    (m.threat&&m.threat.length?m.threat.map(t=>{const c=t.id?CARD[t.id]:null;return `<div class="inv"><div class="row between"><b>${c?cardName(c):esc(t.n)}</b><button class="sm ghost" data-a="pthreatDel" data-v="${t.u}">Rimuovi</button></div>${c?cardBody(c):(t.note?`<div class="small">${esc(t.note)}</div>`:'')}</div>`}).join(''):'<p class="small muted">Vuota. Aggiungi qui le sventure e le debolezze che restano davanti a te (es. Paura Paralizzante).</p>')+`</div>`;
  const others=g.invs.filter(v=>v.slot!==PL.slot);
  if(others.length)h+=`<div class="card"><h3>Compagni</h3>`+others.map(v=>`<div class="row between small" style="padding:5px 0;border-bottom:1px solid var(--line)"><b>${esc(v.name)}</b><span><span style="color:var(--hp)">♥${v.dmg}/${v.hp}</span> <span style="color:var(--san)">✦${v.hor}/${v.san}</span> 💰${v.res} 🔍${v.clues}${v.out?' · eliminato':v.turnDone?' · turno finito':''}</span></div>`).join('')+`</div>`;
  h+=`<div class="row" style="justify-content:center"><button class="sm ghost" data-a="pmenu">Esci dal tavolo</button></div>`;
  return h;
}
const SLOTS={Mano:2,Arcano:2,Accessorio:1,Corpo:1,Alleato:1};
function slotSummary(m){

  return Object.entries(SLOTS).map(([k,n])=>{const u=used[k]||0;return `<span class="slotc ${u>n?'over':''}">${k} ${u}/${n}</span>`}).join('');
}
function renderPCards(m){

    deckGroups(m.deckList).map(([id,n])=>{const c=CARD[id];return `<div class="row between small" style="padding:4px 0;border-bottom:1px solid var(--line)"><span>${n}× ${cardName(c)} <span class="muted">${c.l?'(liv. '+c.l+')':''}</span></span><button class="sm ghost" data-a="pdeckDel" data-v="${id}">−</button></div>`}).join('')+
    `<div class="row" style="margin-top:8px"><button class="sm" data-a="pdeckAdd">+ Aggiungi carta</button><button class="sm primary" data-a="pimport">Importa da ArkhamDB</button></div></details>`;
  h+=`<details><summary>Consulta le carte</summary><input type="text" id="psearch" placeholder="Cerca per nome, tratto o testo" value="${esc(PL.q||'')}"><div id="presults">${searchResults(PL.q||'',false)}</div></details>`;

function toId(v){v=String(v);return /^\d{1,3}$/.test(v)?+v:v;}
function deckGroups(list){const m={};list.forEach(id=>m[id]=(m[id]||0)+1);return Object.entries(m).map(([id,n])=>[toId(id),n]).sort((a,b)=>adbCode(a[0]).localeCompare(adbCode(b[0])));}
function searchResults(q,pick){

  return list.map(c=>`<div class="inv"><div class="row between"><b>${cardName(c)}</b>${pick?`<button class="sm" data-a="${pick}" data-v="${c.id}">Scegli</button>`:''}</div>${cardBody(c)}</div>`).join('')||'<p class="small muted">Nessuna carta trovata.</p>';
}
function renderDigital(m){

  let h=`<div class="card"><div class="row between"><h3>Mano (${d.hand.length})</h3><span class="small muted">Mazzo ${d.draw.length} · Scarti ${d.discard.length}</span></div>`;
  if(d.mull)h+=`<div class="note small">Mulligan: seleziona le carte da sostituire, poi conferma (una sola volta).</div>`;
  h+=d.hand.map((id,k)=>{const c=CARD[id];if(!c)return'';const sel=d.mull&&d.sel&&d.sel.includes(k);
    return `<div class="inv ${sel?'selc':''}"><div class="row between"><b>${cardName(c)}</b><span class="small muted">${c.c!=null?'Costo '+costTxt(c.c):''}</span></div>
    <div class="small muted">${esc(TYPE_IT[c.t]||'')}${c.s?' · '+esc(c.s):''} ${icons(c)}</div>
    <details class="cdet"><summary>Testo</summary>${cardBody(c)}</details>
    <div class="row" style="margin-top:6px">${d.mull?`<button class="sm ${sel?'primary':''}" data-a="pmsel" data-v="${k}">${sel?'Da sostituire':'Sostituisci'}</button>`:
      `${c.t==='asset'||c.t==='event'?`<button class="sm primary" data-a="pplay" data-v="${k}">Gioca${c.c?' ('+costTxt(c.c)+')':''}</button>`:''}${c.ic?`<button class="sm" data-a="pcommit" data-v="${k}">Investi</button>`:''}<button class="sm ghost" data-a="pdiscard" data-v="${k}">Scarta</button>`}</div></div>`}).join('');
  h+=d.mull?`<button class="primary" style="width:100%;margin-top:8px" data-a="pmconfirm">Conferma la mano</button>`:
    `<div class="row" style="margin-top:8px"><button class="primary grow" data-a="pdraw">Pesca 1 carta</button><button class="ghost" data-a="preset">Rifai il mazzo</button></div>`;
  h+=`</div>`;
  if(d.discard.length)h+=`<details><summary>Pila degli scarti (${d.discard.length})</summary>`+d.discard.slice().reverse().map((id,k)=>{const c=CARD[id];const idx=d.discard.length-1-k;return `<div class="row between small" style="padding:4px 0;border-bottom:1px solid var(--line)"><span>${cardName(c)}</span><button class="sm ghost" data-a="pfromdisc" data-v="${idx}">In mano</button></div>`}).join('')+`</details>`;
  return h;
}

function drawOne(m){
  const d=m.deck;let horror=false;
  if(!d.draw.length){if(!d.discard.length){toast('Mazzo e scarti vuoti');return;}d.draw=shuffle(d.discard);d.discard=[];horror=true;}
  const id=d.draw.shift();const c=CARD[id];
  if(horror){m.hor=(m.hor||0)+1;toast('Mazzo vuoto: rimescolati gli scarti, subisci 1 orrore');}
  if(c&&c.wk&&c.t!=='event'){PL.weak=id;setTimeout(()=>openWeak(id),50);}else d.hand.push(id);
}

  pthreatDel(e){pmut(m=>{const t=m.threat.find(x=>x.u===e.dataset.v);m.threat=m.threat.filter(x=>x.u!==e.dataset.v);if(t&&t.id&&m.deck&&m.deckMode==='digitale')m.deck.discard.push(t.id);});},

let IMP=null;
function normName(s){return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();}
function deckFromSlots(slots,invCode){
  const ids=[],skipped=[];
  Object.entries(slots||{}).forEach(([code,n])=>{n=+n||0;
    if(code==='01000'){for(let k=0;k<n;k++)ids.push(BASIC_WK[Math.floor(Math.random()*BASIC_WK.length)]);return;}
    const core=/^01\d{3}$/.test(code)&&+code.slice(2)<=103?+code.slice(2):null;
    const id=core!=null?core:(CARDBASE[code]?code:null);
    if(id!=null&&CARDBASE[id]&&CARDBASE[id].t!=='investigator'){for(let k=0;k<n;k++)ids.push(id);}
    else skipped.push(n+'× '+code);});
  return {ids,skipped,inv:invCode||null};
}
function deckFromText(t){
  const ids=[],skipped=[];
  t.split(/\r?\n/).forEach(line=>{const m=line.match(/^\s*(\d+)\s*x?\s+(.+?)\s*(\(.*\))?\s*$/i);if(!m)return;
    const n=+m[1],nm=normName(m[2].replace(/\s+\[\d\]$/,'').replace(/•/g,''));
    const lv=(m[2].match(/\((\d)\)|\[(\d)\]/)||[]);const want=lv[1]||lv[2];
    const cands=CARDS.concat(ALLCARDS).filter(c=>c.id!==0&&c.t!=='investigator'&&(normName(c.en)===nm||normName(c.n)===nm));
    const c=cands.find(x=>want!=null&&String(x.l||0)===want)||cands.find(x=>!x.l)||cands[0];
    if(c){for(let k=0;k<n;k++)ids.push(c.id);}else skipped.push(n+'× '+m[2]);});
  return {ids,skipped,inv:null};
}
async function fetchAdb(kind,id){
  const order=kind==='deck'?['deck','decklist']:['decklist','deck'];let last='';
  for(const k of order){try{const r=await fetch(`https://arkhamdb.com/api/public/${k}/${id}.json`);if(r.ok){const j=await r.json();if(j&&j.slots)return j;}last='risposta '+r.status;}catch(e){last=e.message;}}
  throw new Error(last||'mazzo non trovato');
}
async function runImport(){
  const t=document.getElementById('impDeck').value.trim();const msg=document.getElementById('impMsg2');if(!t)return;
  msg.style.color='var(--mut)';msg.textContent='Leggo il mazzo…';
  await loadAllCards();
  try{
    let res;
    if(t.startsWith('{')){const j=JSON.parse(t);res=deckFromSlots(j.slots,j.investigator_code);res.name=j.name;}
    else{const m=t.match(/(decklist|deck)\/view\/(\d+)/)||t.match(/^(\d+)$/);
      if(m){const kind=m[2]?m[1]:'decklist',id=m[2]||m[1];const j=await fetchAdb(kind,id);res=deckFromSlots(j.slots,j.investigator_code);res.name=j.name;}
      else res=deckFromText(t);}
    if(!res.ids.length)throw new Error('nessuna carta riconosciuta');
    IMP=res;const m=me();const myCode=INV_CARD[m.inv]?adbCode(INV_CARD[m.inv]):null;const invC=res.inv?(CARDBASE[res.inv]||CARDBASE[+res.inv.slice(2)]):null;
    const wrongInv=res.inv&&myCode&&res.inv!==myCode;
    msg.innerHTML=`<div class="note okbox">${res.name?'<b>'+esc(res.name)+'</b><br>':''}${res.ids.length} carte riconosciute.</div>`+
      (wrongInv?`<div class="note warn">Questo mazzo è per ${esc((invC||{}).n||res.inv)}, non per ${esc(m.name)}.</div>`:'')+
      (res.skipped.length?`<div class="note warn">Saltate (non riconosciute): ${esc(res.skipped.join(', '))}</div>`:'')+
      `<button class="primary" style="width:100%;margin-top:6px" data-a="pimportOk">Sostituisci il mio mazzo con questo</button>`;
  }catch(e){msg.style.color='#f0b3ab';msg.textContent='Non riesco a importare: '+e.message+'. Se il link non funziona, apri il mazzo su ArkhamDB, scegli Download → Text file e incolla qui il contenuto.';}
}

  async libRekey(){const k=document.getElementById('libNewKey').value.trim();if(!k)return;

      const g=S.game;if(g&&g.online)g.online.lib=null;linkLibToTable();openLibrary();toast('Codice cambiato: inseriscilo anche sugli altri tuoi dispositivi');}

    catch(e){document.getElementById('libErr').textContent=e.message;}},
  libCopy(){const t=document.getElementById('libKeyOut');t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('Codice copiato'),()=>{});}catch(_){}},
  libForget(){LIBKEY=null;try{localStorage.removeItem('ahlcg-libkey');}catch(e){}IMG_AUTH=null;refreshImgList(true);closeModal();render();},
  async libBulk(){const files=await pickFiles(true);if(!files.length)return;const msg=document.getElementById('libMsg');let ok=0;const bad=[];
    for(const f of files){const code=codeFromFilename(f.name);if(!code){bad.push(f.name);continue;}
      if(msg)msg.textContent=`Carico ${ok+bad.length+1}/${files.length}: ${f.name}…`;
      try{await uploadImg(code,f);ok++;}catch(e){bad.push(f.name+' ('+e.message+')');}}
    if(msg)msg.innerHTML=`<div class="note okbox">${ok} immagini salvate.</div>`+(bad.length?`<div class="note warn">Non caricate: ${esc(bad.join(', '))}</div>`:'');render();},
  cvclose(){const ov=document.getElementById('cv');if(ov)ov.classList.remove('on');},
  pimport(){IMP=null;openModal(`<h2 style="margin-bottom:8px">Importa da ArkhamDB</h2>
    <p class="small muted">Incolla il link del mazzo (es. <i>arkhamdb.com/decklist/view/12345</i> o <i>/deck/view/…</i>), il suo numero, oppure il testo esportato da ArkhamDB (Download → Text file).</p>
    <textarea id="impDeck" style="width:100%;height:110px;font:13px/1.4 Inter,sans-serif;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px" placeholder="https://arkhamdb.com/decklist/view/…"></textarea>
    <div id="impMsg2" class="small" style="margin-top:6px"></div>
    <div class="navbtns"><button class="ghost" data-a="close">Chiudi</button><button data-a="pimportRun">Leggi il mazzo</button></div>`);},
  pimportRun(){runImport();},
  pimportOk(){if(!IMP)return;const ids=IMP.ids;IMP=null;closeModal();
    pmut(m=>{m.deckList=ids;if(m.deck)m.deck=null;});toast('Mazzo importato: '+ids.length+' carte');}
});

const CARDS_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="11" height="15" rx="2"/><path d="M14 7.5l4.5 1.2a2 2 0 0 1 1.4 2.4l-2.6 9.6a2 2 0 0 1-2.4 1.4L9 20.6"/></svg>';
const _render=render;
render=function(){
  if(PL.on){renderPlayer();return;}
  _render();
  if(!S.game&&S.tab==='round'){const app=document.getElementById('app');
    app.insertAdjacentHTML('afterbegin',`<div class="card"><h3>Sei un giocatore?</h3><p class="small muted">Inserisci il codice che ti ha dato la guida.</p><div class="row"><input type="text" id="joinCode" class="grow" style="flex:1;width:auto;text-transform:uppercase" maxlength="8" placeholder="Codice"><button class="primary" data-a="pjoin">Entra</button></div></div>`);}
  if(S.game&&S.tab==='team'&&S.game.online)decorateTeam();
  ensureConn();paintConn();linkLibToTable();
};
function decorateTeam(){
  const cards=document.querySelectorAll('#app > .card');const g=S.game;const ord=order(g);
  ord.forEach((i,k)=>{const el=cards[k];const r=REMOTE['s'+i];if(!el||!r)return;
    let h=`<div class="note small" style="margin-top:8px"><b>Dal telefono:</b> ${r.deckMode==='digitale'?`mazzo digitale${r.deck?` · mano ${r.deck.hand.length} · mazzo ${r.deck.draw.length}`:' (non ancora mescolato)'}`:'carte fisiche'}`;
    if(r.inplay&&r.inplay.length)h+=`<br>In gioco: `+r.inplay.map(e=>{const c=CARD[e.id];return c?cardName(c)+(e.uses!=null?` (${e.uses})`:'')+(e.ex?' [esaurita]':''):''}).join(', ');
    if(r.threat&&r.threat.length)h+=`<br>Area di minaccia: `+r.threat.map(t=>t.id&&CARD[t.id]?cardName(CARD[t.id]):esc(t.n)).join(', ');
    el.insertAdjacentHTML('beforeend',h+'</div>');});
}
const _mut=mut;
mut=function(fn){const before=S.game?clone(S.game):null;_mut(fn);syncHost(before,S.game);};
H.undo=function(){if(!UNDO.length)return;const before=clone(S.game);S.game=JSON.parse(UNDO.pop());save();render();syncHost(before,S.game);};
H.draw=function(){
  if(S.drawing)return;const g=PL.on?pseudo():G();const bag=bagOf(g?g.scen:S.setup.scen,g?g.diff:S.setup.diff);
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  S.drawing=true;render();const w=document.getElementById('bagwrap');if(w)w.classList.add('shaking');
  setTimeout(()=>{S.drawing=false;const t=bag[Math.floor(Math.random()*bag.length)];S.draw=t;S.justDrew=true;save();render();
    const auth=PL.on?PL.code:(S.game&&S.game.online?S.game.online.token:null);
    if(auth){OWN_DRAW=true;const m=PL.on?me():null;enqueue([['ah_draw',{p_auth:auth,p_tok:t,p_who:PL.on?(m.player||m.name):'La guida'}]]);}
  },reduce?150:850);
};
const _openMenu=openMenu;
openMenu=function(){_openMenu();const g=G();
  const op=document.querySelector('#sheet .opts');if(op)op.insertAdjacentHTML('beforeend','<button data-a="libMenu">Immagini delle carte…</button>');
  if(!g)return;
  const opts=document.querySelector('#sheet .opts');if(opts)opts.insertAdjacentHTML('afterbegin',`<button class="${g.online?'':'primary'}" data-a="tableMenu">${g.online?'Tavolo online: codici dei giocatori':'Tavolo online…'}</button>`);};
(function initOnline(){
  let code=null;try{code=new URLSearchParams(location.search).get('codice');}catch(e){}
  if(!code){try{code=localStorage.getItem('ahlcg-codice');}catch(e){}}
  const ver=document.getElementById('ver');if(ver&&!document.getElementById('conn'))ver.insertAdjacentHTML('afterend','<span id="conn" class="conn" style="display:none"></span>');
  if(code)joinTable(code);else render();
  loadAllCards();
})();
